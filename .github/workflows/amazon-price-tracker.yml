name: Amazon Price Tracker

on:
  schedule:
    # Run 6 times daily matching Windows schedule (IST times: 6am, 10am, 2pm, 6pm, 9pm, 11:30pm)
    # Note: GitHub pauses scheduled workflows if repo is inactive for 60+ days
    # To reactivate: Manually trigger the workflow once via workflow_dispatch
    - cron: '0 3,6,18 * * *'      # 03:00 (8:30 IST), 06:00 (11:30 IST), 18:00 (23:30 IST)
    - cron: '30 8,12,15 * * *'    # 08:30 (14:00 IST), 12:30 (18:00 IST), 15:30 (21:00 IST)
  
  # Trigger on push to main branch (keeps workflow active)
  push:
    branches:
      - main
    paths:
      - 'amazon_price_tracker.py'
      - '.github/workflows/amazon-price-tracker.yml'
  
  # Allow manual trigger (use this to "wake up" scheduled workflows)
  # IMPORTANT: If scheduled runs aren't working, manually trigger this once
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search query (optional)'
        required: false
        default: ''

jobs:
  track-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Limit to 10 minutes max
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install playwright requests beautifulsoup4 lxml
          python -m playwright install chromium --with-deps
      
      - name: Pull latest price history
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git pull origin main || echo "Pull failed, continuing..."
      
      - name: Run Amazon Price Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_QUERY: ${{ github.event.inputs.search_query }}
        run: |
          python amazon_price_tracker.py
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amazon-deals-${{ github.run_number }}
          path: |
            amazon_deals.json
            amazon_deals_new.json
            price_changes.json
            screenshots/*.png
          retention-days: 7  # Reduced from 30 to save storage
      
      - name: Commit price history
        run: |
          git add amazon_deals.json price_history.json price_changes.json amazon_deals_new.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Amazon price history - $(date +'%Y-%m-%d %H:%M')"
            git push || echo "Push failed - this is expected if no changes"
          fi

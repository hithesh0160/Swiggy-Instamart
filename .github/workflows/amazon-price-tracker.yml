name: Amazon Price Tracker

on:
  schedule:
    # Run once daily at 6:00 PM IST (12:30 UTC)
    # Note: GitHub pauses scheduled workflows if repo is inactive for 60+ days
    # To reactivate: Manually trigger the workflow once via workflow_dispatch
    - cron: '30 12 * * *'
  
  # Trigger on push to main branch (keeps workflow active)
  push:
    branches:
      - main
    paths:
      - 'amazon_price_tracker.py'
      - '.github/workflows/amazon-price-tracker.yml'
  
  # Allow manual trigger (use this to "wake up" scheduled workflows)
  # IMPORTANT: If scheduled runs aren't working, manually trigger this once
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Search query (optional)'
        required: false
        default: ''

jobs:
  track-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 70+ categories need more than 10 minutes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install playwright requests beautifulsoup4 lxml
          python -m playwright install chromium --with-deps
      
      - name: Clean up old screenshots
        run: |
          rm -rf screenshots/*.png
          mkdir -p screenshots

      - name: Pull latest price history
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git pull --rebase origin main || echo "Pull failed, continuing..."
      
      - name: Run Amazon Price Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_QUERY: ${{ github.event.inputs.search_query }}
        run: |
          python amazon_price_tracker.py
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amazon-deals-${{ github.run_number }}
          path: |
            amazon_deals.json
            amazon_deals_new.json
            price_changes.json
            screenshots/*.png
          retention-days: 7  # Reduced from 30 to save storage
      
      - name: Commit price history
        run: |
          git add amazon_deals.json price_history.json price_changes.json amazon_deals_new.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Amazon price history - $(date +'%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              echo "Push failed, retry $i/3..."
              sleep 5
            done
          fi
